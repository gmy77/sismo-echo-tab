<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>SISMO ECHO Tab</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  background: #02040a;
  color: #e8f4f8;
  font-family: 'Segoe UI', system-ui, sans-serif;
}

/* ── WebGL canvas (background) ── */
#bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
}

/* ── Glass overlay ── */
#ui {
  position: relative; z-index: 10;
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0;
  pointer-events: none;
}

/* ── Clock ── */
#clock-wrap {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px;
  pointer-events: none;
  margin-bottom: 20px;
}
#greeting {
  font-family: 'Courier New', monospace;
  font-size: .72rem; letter-spacing: .28em;
  text-transform: uppercase; color: #4ecdc4aa;
  animation: fadeUp .6s ease both;
}
#clock {
  font-size: clamp(5rem, 15vw, 10.5rem);
  font-weight: 100; letter-spacing: -.05em;
  line-height: 1;
  background: linear-gradient(135deg,
    #ffffff 0%, #a8edea 30%, #fed6e3 60%, #a8c8ea 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 40px rgba(168,237,234,.35));
  animation: fadeUp .6s ease .05s both;
  user-select: none;
}
#date {
  font-family: 'Courier New', monospace;
  font-size: .78rem; letter-spacing: .2em;
  color: #4ecdc488; text-transform: uppercase;
  animation: fadeUp .6s ease .1s both;
}

/* ── Search ── */
.search-wrap {
  width: 100%; max-width: 520px;
  pointer-events: all;
  animation: fadeUp .6s ease .18s both;
  margin-bottom: 28px;
}
.search-wrap form { display: flex; gap: 0; }
#search-input {
  flex: 1;
  padding: 14px 24px;
  border-radius: 50px 0 0 50px;
  border: 1px solid rgba(168,237,234,.2);
  border-right: none;
  background: rgba(2,4,10,.55);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  color: #e8f4f8; font-size: .95rem; outline: none;
  transition: border-color .3s, box-shadow .3s;
}
#search-input:focus {
  border-color: rgba(168,237,234,.5);
  box-shadow: 0 0 30px rgba(168,237,234,.1), inset 0 0 20px rgba(168,237,234,.03);
}
#search-input::placeholder { color: #2a4a52; }
.search-btn {
  padding: 14px 28px;
  border-radius: 0 50px 50px 0;
  border: 1px solid rgba(168,237,234,.2);
  background: linear-gradient(135deg, rgba(78,205,196,.25), rgba(168,130,234,.25));
  backdrop-filter: blur(20px);
  color: #a8edea; font-size: 1rem; cursor: pointer;
  transition: background .25s, transform .15s;
  pointer-events: all;
}
.search-btn:hover {
  background: linear-gradient(135deg, rgba(78,205,196,.45), rgba(168,130,234,.45));
  transform: scale(1.03);
}

/* ── Cards row ── */
.cards {
  display: flex; gap: 14px; flex-wrap: wrap;
  justify-content: center;
  animation: fadeUp .6s ease .28s both;
  pointer-events: all;
}

.card {
  min-width: 170px; max-width: 220px;
  padding: 18px 20px;
  border-radius: 20px;
  border: 1px solid rgba(168,237,234,.12);
  background: rgba(2,8,16,.45);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  box-shadow:
    0 8px 32px rgba(0,0,0,.4),
    0 0 0 1px rgba(168,237,234,.04) inset,
    0 1px 0 rgba(255,255,255,.06) inset;
  transition: border-color .3s, transform .25s, box-shadow .3s;
  position: relative; overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,237,234,.3), transparent);
}
.card:hover {
  border-color: rgba(168,237,234,.28);
  transform: translateY(-4px);
  box-shadow:
    0 16px 48px rgba(0,0,0,.5),
    0 0 24px rgba(78,205,196,.08),
    0 0 0 1px rgba(168,237,234,.08) inset;
}

.card-label {
  font-family: 'Courier New', monospace;
  font-size: .6rem; letter-spacing: .22em;
  text-transform: uppercase; color: #4ecdc4;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.pulse-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #4ecdc4; flex-shrink: 0;
  box-shadow: 0 0 6px #4ecdc4;
  animation: pulse 2s ease-in-out infinite;
}
.pulse-dot.orange { background: #ffa07a; box-shadow: 0 0 6px #ffa07a; }

.card-value {
  font-size: 2.8rem; font-weight: 100;
  line-height: 1; letter-spacing: -.02em;
  color: #a8edea;
  text-shadow: 0 0 30px rgba(168,237,234,.4);
}
.card-unit {
  font-family: 'Courier New', monospace;
  font-size: .58rem; letter-spacing: .14em;
  color: #2a4a52; text-transform: uppercase;
  margin-top: 2px;
}

/* Kp bar */
.kp-track {
  margin-top: 10px; height: 3px; border-radius: 2px;
  background: rgba(255,255,255,.05); overflow: hidden;
  position: relative;
}
.kp-fill {
  height: 100%; border-radius: 2px; width: 0;
  background: linear-gradient(90deg, #4ecdc4, #a882ea);
  transition: width 1.2s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 8px rgba(78,205,196,.5);
}

.card-meta {
  margin-top: 8px; display: flex; flex-direction: column; gap: 3px;
}
.card-row {
  font-family: 'Courier New', monospace;
  font-size: .6rem; color: #1e3340; letter-spacing: .06em;
}
.card-row b { color: #4ecdc488; font-weight: 400; margin-left: 4px; }

/* ── Solar Wind card ── */
.sw-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; margin-top: 8px;
}
.sw-cell {
  font-family: 'Courier New', monospace;
  font-size: .58rem; color: #1e3340; letter-spacing: .05em;
}
.sw-cell b { display: block; font-size: .82rem; color: #a8edea88; font-weight: 300; margin-top: 1px; }

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .3; transform: scale(.7); }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="ui">
  <div id="clock-wrap">
    <span id="greeting"></span>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </div>

  <div class="search-wrap">
    <form action="https://www.google.com/search" method="get" target="_top">
      <input id="search-input" type="text" name="q"
             placeholder="Cerca con Google…" autocomplete="off" autofocus>
      <button class="search-btn" type="submit">↵</button>
    </form>
  </div>

  <div class="cards">

    <!-- Kp Index -->
    <div class="card">
      <div class="card-label"><span class="pulse-dot"></span>PLANETARY Kp</div>
      <div class="card-value" id="kp-val">--</div>
      <div class="card-unit">geomagnetic index</div>
      <div class="kp-track"><div class="kp-fill" id="kp-fill"></div></div>
      <div class="card-meta">
        <div class="card-row">Stato<b id="kp-status">…</b></div>
        <div class="card-row">Fonte<b>NOAA SWPC</b></div>
      </div>
    </div>

    <!-- Solar Wind -->
    <div class="card">
      <div class="card-label"><span class="pulse-dot orange"></span>SOLAR WIND</div>
      <div class="card-value" id="sw-speed" style="color:#ffa07a;text-shadow:0 0 30px rgba(255,160,122,.4)">--</div>
      <div class="card-unit">km/s — velocità vento solare</div>
      <div class="sw-grid">
        <div class="sw-cell">Densità<b id="sw-density">… n/cc</b></div>
        <div class="sw-cell">Bt<b id="sw-bt">… nT</b></div>
        <div class="sw-cell">Bz<b id="sw-bz">… nT</b></div>
        <div class="sw-cell">Fonte<b>ACE/DSCOVR</b></div>
      </div>
    </div>

    <!-- Xray / Flare -->
    <div class="card">
      <div class="card-label"><span class="pulse-dot" style="background:#a882ea;box-shadow:0 0 6px #a882ea"></span>X-RAY FLUX</div>
      <div class="card-value" id="xr-class" style="color:#c4a8ea;text-shadow:0 0 30px rgba(196,168,234,.4)">--</div>
      <div class="card-unit">solar flare class</div>
      <div class="card-meta">
        <div class="card-row">Flux<b id="xr-flux">…</b></div>
        <div class="card-row">Stato<b id="xr-status">…</b></div>
        <div class="card-row">Fonte<b>GOES-16/18</b></div>
      </div>
    </div>

  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  WEBGL BACKGROUND — Particle Nebula + Aurora Shader
// ════════════════════════════════════════════════════════
(function() {
  const canvas = document.getElementById('bg-canvas');
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) return;

  function resize() {
    canvas.width  = window.innerWidth  * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Vertex Shader ──
  const VS = `
    precision highp float;
    attribute vec2 a_pos;
    void main() {
      gl_Position = vec4(a_pos, 0., 1.);
    }
  `;

  // ── Fragment Shader (aurora + stars + rays) ──
  const FS = `
    precision highp float;
    uniform float u_time;
    uniform vec2  u_res;
    uniform float u_kp;

    // Hash & noise
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
                 mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v=0., a=.5;
      for(int i=0;i<6;i++){
        v += a*noise(p); p *= 2.1; a *= .5;
      }
      return v;
    }

    // Stars
    float stars(vec2 uv, float density, float t) {
      vec2 g = floor(uv * density);
      float h = hash(g);
      if(h > .985) {
        float twinkle = .6 + .4*sin(t*3.+h*60.);
        return twinkle * smoothstep(.995, .999, h);
      }
      return 0.;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_res;
      float t = u_time;
      float kp = clamp(u_kp / 9., 0., 1.);

      // ── Deep space base ──
      vec3 col = mix(vec3(0.005, 0.01, 0.025), vec3(0.01, 0.02, 0.04), uv.y);

      // ── Stars (3 layers) ──
      col += stars(uv, 120., t) * vec3(.9,.95,1.);
      col += stars(uv, 200., t+1.) * vec3(.8,.9,1.) * .7;
      col += stars(uv, 300., t+2.) * vec3(1.,.9,.8) * .5;

      // ── Aurora ribbons (intensity driven by Kp) ──
      float auroraBase = .08 + kp * .18;
      for(int i=0; i<4; i++) {
        float fi = float(i);
        float freq = 1.4 + fi*.3;
        float spd  = .18 + fi*.07;
        float yBase= .62 + fi*.06;

        float wave = fbm(vec2(uv.x * freq + t*spd, t*.12 + fi*1.7));
        float ribbon = yBase + wave*.14 - .06;
        float dist = abs(uv.y - ribbon);
        float glow = exp(-dist*dist * 80.) * auroraBase;
        glow += exp(-dist*dist * 20.) * auroraBase * .4;

        vec3 ac;
        if(i==0) ac = vec3(.1, .9, .7);
        else if(i==1) ac = vec3(.05,.6,.9);
        else if(i==2) ac = vec3(.55,.2,.9);
        else          ac = vec3(.1,.8,.5);

        col += ac * glow * (1.5 + kp);
      }

      // ── Cosmic dust / nebula ──
      float dust = fbm(uv*3. + vec2(t*.02, t*.015));
      dust = pow(dust, 3.5);
      col += vec3(.06,.12,.18) * dust * .6;

      // ── Vignette ──
      vec2 vig = uv - .5;
      float v = 1. - dot(vig, vig)*1.8;
      col *= max(v, 0.);

      // ── Subtle scan lines (retro) ──
      float scan = sin(gl_FragCoord.y * .5) * .012;
      col -= scan;

      // ── Chromatic light leak top ──
      float leak = smoothstep(.85, 1., uv.y) * .04;
      col += vec3(.1,.4,.8) * leak;

      gl_FragColor = vec4(pow(col, vec3(1./2.2)), 1.);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  // Full-screen quad
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes  = gl.getUniformLocation(prog, 'u_res');
  const uKp   = gl.getUniformLocation(prog, 'u_kp');

  // Exposed so NOAA fetch can update it
  window._bgKp = 0;

  let t0 = performance.now();
  function render(now) {
    const t = (now - t0) * .001;
    gl.uniform1f(uTime, t);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uKp, window._bgKp || 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();

// ════════════════════════════════════════════════════════
//  3D PARTICLE SYSTEM — Canvas 2D layer
// ════════════════════════════════════════════════════════
(function() {
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%';
  document.body.appendChild(c);
  const ctx = c.getContext('2d');

  let W, H;
  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Mouse parallax
  let mx = 0, my = 0;
  window.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth  - .5) * 2;
    my = (e.clientY / window.innerHeight - .5) * 2;
  });

  // Particles in 3D space
  const N = 180;
  const pts = Array.from({length: N}, () => ({
    x: (Math.random() - .5) * 2,
    y: (Math.random() - .5) * 2,
    z: Math.random(),
    vx: (Math.random() - .5) * .0003,
    vy: (Math.random() - .5) * .0003,
    vz: (Math.random() - .5) * .0005,
    r: Math.random() * 1.8 + .4,
    hue: Math.floor(Math.random() * 3),
  }));

  const COLORS = ['rgba(78,205,196,', 'rgba(168,130,234,', 'rgba(100,180,255,'];

  function project(p) {
    const fov = 1.5;
    const px = mx * .04, py = my * .04;
    const x = p.x + px, y = p.y + py;
    const z = .4 + p.z * .6;
    return {
      sx: W/2 + (x / z) * W * .35,
      sy: H/2 + (y / z) * H * .35,
      sc: 1 / z,
    };
  }

  let last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (ts - last < 16) return;
    last = ts;

    ctx.clearRect(0, 0, W, H);

    // Update + draw
    const sorted = pts
      .map(p => { p.x+=p.vx; p.y+=p.vy; p.z+=p.vz;
        if(p.x<-1||p.x>1) p.vx*=-1;
        if(p.y<-1||p.y>1) p.vy*=-1;
        if(p.z<0||p.z>1) p.vz*=-1;
        return {p, proj: project(p)};
      })
      .sort((a,b)=>a.proj.sc-b.proj.sc);

    // Connection lines
    for(let i=0;i<sorted.length;i++) {
      for(let j=i+1;j<sorted.length;j++) {
        const a = sorted[i], b = sorted[j];
        const dx = a.proj.sx-b.proj.sx, dy = a.proj.sy-b.proj.sy;
        const dist = Math.hypot(dx,dy);
        if(dist < 90) {
          const alpha = (1-dist/90)*.06 * Math.min(a.proj.sc, b.proj.sc);
          ctx.beginPath();
          ctx.moveTo(a.proj.sx, a.proj.sy);
          ctx.lineTo(b.proj.sx, b.proj.sy);
          ctx.strokeStyle = `rgba(78,205,196,${alpha})`;
          ctx.lineWidth = .5;
          ctx.stroke();
        }
      }
    }

    // Particles
    sorted.forEach(({p, proj}) => {
      const r = p.r * proj.sc * 2.5;
      const alpha = Math.min(proj.sc * .7, .8);
      const col = COLORS[p.hue];
      const grd = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, r*3);
      grd.addColorStop(0, col + alpha + ')');
      grd.addColorStop(.4, col + alpha*.4 + ')');
      grd.addColorStop(1,  col + '0)');
      ctx.beginPath();
      ctx.arc(proj.sx, proj.sy, r*3, 0, Math.PI*2);
      ctx.fillStyle = grd;
      ctx.fill();
    });
  }
  requestAnimationFrame(frame);
})();

// ════════════════════════════════════════════════════════
//  CLOCK
// ════════════════════════════════════════════════════════
const DAYS   = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                'luglio','agosto','settembre','ottobre','novembre','dicembre'];
const Z = n => String(n).padStart(2,'0');

function greet(h) {
  if(h<5)  return '🌙 BUONANOTTE · GIMMY';
  if(h<12) return '☀️ BUONGIORNO · GIMMY';
  if(h<17) return '🌤 BUON POMERIGGIO · GIMMY';
  return '🌆 BUONASERA · GIMMY';
}
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent = Z(n.getHours())+':'+Z(n.getMinutes());
  document.getElementById('date').textContent =
    DAYS[n.getDay()]+' '+n.getDate()+' '+MONTHS[n.getMonth()]+' '+n.getFullYear();
  document.getElementById('greeting').textContent = greet(n.getHours());
}
tick(); setInterval(tick, 1000);

// ════════════════════════════════════════════════════════
//  NOAA DATA
// ════════════════════════════════════════════════════════

// Kp Index
async function fetchKp() {
  try {
    const r = await fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json');
    if(!r.ok) throw 0;
    const d = await r.json();
    const last = d[d.length-1];
    const kp = parseFloat(last?.kp_index ?? last?.Kp ?? 0);
    window._bgKp = kp;

    document.getElementById('kp-val').textContent = kp.toFixed(1);
    document.getElementById('kp-fill').style.width = Math.min(kp/9*100,100)+'%';

    let status, col;
    if(kp<1)      { status='Silenzio cosmico'; col='#4ecdc4'; }
    else if(kp<3) { status='Tranquillo';        col='#4ecdc4'; }
    else if(kp<5) { status='⚡ Attivo';          col='#ffe082'; }
    else if(kp<7) { status='⚠️ Perturbato';      col='#ffa07a'; }
    else          { status='🔴 Tempesta G'+(kp<8?'2':kp<9?'3':'4+'); col='#ff5252'; }

    document.getElementById('kp-val').style.color = col;
    document.getElementById('kp-val').style.textShadow = `0 0 40px ${col}88`;
    document.getElementById('kp-fill').style.background = `linear-gradient(90deg,${col},#a882ea)`;
    document.getElementById('kp-fill').style.boxShadow  = `0 0 10px ${col}88`;
    document.getElementById('kp-status').textContent = status;
  } catch {
    document.getElementById('kp-val').textContent = '⚠';
  }
}

// Solar Wind (DSCOVR)
async function fetchSolarWind() {
  try {
    const r = await fetch('https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json');
    if(!r.ok) throw 0;
    const d = await r.json();
    const last = d[d.length-1];
    const speed   = last?.proton_speed   ?? last?.speed   ?? null;
    const density = last?.proton_density ?? last?.density ?? null;
    const bt      = last?.bt ?? null;
    const bz      = last?.bz_gsm ?? last?.bz ?? null;

    document.getElementById('sw-speed').textContent   = speed   ? Math.round(speed)  : '--';
    document.getElementById('sw-density').textContent = density ? density.toFixed(1)+' n/cc' : '-- n/cc';
    document.getElementById('sw-bt').textContent      = bt      ? bt.toFixed(1)+' nT'   : '-- nT';

    if(bz !== null) {
      const bzEl = document.getElementById('sw-bz');
      bzEl.textContent = bz.toFixed(1)+' nT';
      bzEl.style.color = bz < -5 ? '#ff5252' : bz < 0 ? '#ffa07a' : '#4ecdc4';
    } else {
      document.getElementById('sw-bz').textContent = '-- nT';
    }

    // Color speed by activity
    const spEl = document.getElementById('sw-speed');
    if(speed) {
      const s = Math.round(speed);
      spEl.style.color = s > 700 ? '#ff5252' : s > 500 ? '#ffa07a' : '#ffa07a';
    }
  } catch {
    document.getElementById('sw-speed').textContent = '⚠';
  }
}

// X-Ray Flux (GOES)
async function fetchXray() {
  try {
    const r = await fetch('https://services.swpc.noaa.gov/json/goes/secondary/xrays-1-minute.json');
    if(!r.ok) throw 0;
    const d = await r.json();
    const last = d[d.length-1];
    const flux = last?.flux ?? last?.observed_flux ?? null;

    if(flux !== null) {
      let cls, col, status;
      if     (flux >= 1e-3) { cls='X'+(flux/1e-4).toFixed(0); col='#ff3030'; status='🔴 MEGA FLARE'; }
      else if(flux >= 1e-4) { cls='X'+(flux/1e-4).toFixed(1); col='#ff5252'; status='🔴 X-Flare!'; }
      else if(flux >= 1e-5) { cls='M'+(flux/1e-5).toFixed(1); col='#ffa07a'; status='⚠️ M-Flare'; }
      else if(flux >= 1e-6) { cls='C'+(flux/1e-6).toFixed(1); col='#ffe082'; status='C-Flare'; }
      else if(flux >= 1e-7) { cls='B'+(flux/1e-7).toFixed(1); col='#4ecdc4'; status='Basso'; }
      else                   { cls='A';                          col='#2a6060'; status='Quiete'; }

      const el = document.getElementById('xr-class');
      el.textContent = cls;
      el.style.color = col;
      el.style.textShadow = `0 0 30px ${col}88`;
      document.getElementById('xr-flux').textContent  = flux.toExponential(2)+' W/m²';
      document.getElementById('xr-status').textContent = status;
    }
  } catch {
    document.getElementById('xr-class').textContent = '⚠';
  }
}

// Boot
fetchKp();       setInterval(fetchKp,      60_000);
fetchSolarWind(); setInterval(fetchSolarWind, 60_000);
fetchXray();      setInterval(fetchXray,    60_000);
</script>
